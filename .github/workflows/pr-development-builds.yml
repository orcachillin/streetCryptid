name: PR standalone Release builds

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-development-builds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EAS_CLI_VERSION: 21.0.3

jobs:
  build_ios:
    name: Build and upload iOS Release
    if: >-
      ${{github.event.pull_request.head.repo.full_name == github.repository}}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: development-builds
    permissions:
      contents: read
    # Masked install URL handed to the notify job so it can post one combined,
    # threaded Discord reply per commit. Job outputs are not echoed to logs and
    # are not exposed via the public REST API.
    outputs:
      install_url: ${{ steps.upload.outputs.install_url }}
    env:
      EAS_BUILD_GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
      EXPO_NO_KEYCHAIN: '1'
    steps:
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "The development-builds environment is missing EXPO_TOKEN." >&2
            exit 1
          fi

      - name: Configure isolated build paths
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "BUILD_ARTIFACT=$RUNNER_TEMP/streetcryptid-pr-$PR_NUMBER.ipa"
            echo "EAS_LOCAL_BUILD_ARTIFACTS_DIR=$RUNNER_TEMP/eas-artifacts-ios"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-local-build-ios"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/modules/iroh-location/rust/target"
            echo "RUSTUP_TOOLCHAIN=stable"
          } >> "$GITHUB_ENV"

      - name: Check out PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore JavaScript package caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm/_cacache
          key: eas-local-js-${{ runner.os }}-${{ runner.arch }}-${{ env.EAS_CLI_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            eas-local-js-${{ runner.os }}-${{ runner.arch }}-${{ env.EAS_CLI_VERSION }}-

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Select the SDK 57 Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: modules/iroh-location/rust -> target
          key: eas-local-${{ hashFiles('scripts/eas-build-pre-install.sh', 'scripts/generate-uniffi-bindings.sh', 'modules/iroh-location/rust/src/**/*.rs', 'modules/iroh-location/rust/third_party/**/*.rs') }}
          cache-workspace-crates: 'true'

      - name: Restore CocoaPods download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: eas-local-cocoapods-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'app.json', 'app.config.ts', 'modules/iroh-location/ios/IrohLocation.podspec') }}
          restore-keys: |
            eas-local-cocoapods-${{ runner.os }}-

      - name: Install EAS CLI
        run: bun add --global "eas-cli@$EAS_CLI_VERSION"

      - name: Verify EAS log isolation
        run: bash scripts/test-eas-ci-log-isolation.sh

      - name: Build the standalone Release locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" "$EAS_LOCAL_BUILD_WORKINGDIR"
          bash scripts/eas-local-build-ci.sh \
            ios \
            production-internal-ios \
            "$BUILD_ARTIFACT"

      # Join the tailnet so the internal distribution host is reachable. The
      # ephemeral node is torn down at job end. Nothing prints the tailnet
      # topology (no `tailscale status`), keeping it off the public logs.
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Bland fixed node name so neither the logs nor the tailnet admin view
          # show anything identifying. The action's own output is benign (version
          # + download + "connected"); the tailnet topology only ever leaks from
          # an explicit `tailscale status`, which this workflow never runs.
          hostname: ci-ephemeral

      - name: Upload the build to the internal distribution server
        id: upload
        env:
          DISTRIBUTOR_BASE_URL: ${{ secrets.DISTRIBUTOR_BASE_URL }}
          DISTRIBUTOR_TOKEN: ${{ secrets.DISTRIBUTOR_TOKEN }}
        run: |
          set -euo pipefail
          # Suppress all output: the install URL and internal host must not reach
          # the public logs. The masked URL is written to $GITHUB_OUTPUT for the
          # notify job to post to Discord.
          if ! bash scripts/upload-build.sh ios "$BUILD_ARTIFACT" >/dev/null 2>&1; then
            echo "Uploading the build to the internal distribution server failed." >&2
            exit 1
          fi

      - name: Remove local build state
        if: always()
        run: |
          set -euo pipefail
          for path in \
            "${EAS_LOCAL_BUILD_ARTIFACTS_DIR:-}" \
            "${EAS_LOCAL_BUILD_WORKINGDIR:-}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            if [[ "$path" != "$RUNNER_TEMP/"* ]]; then
              echo "Refusing to clean unexpected path: $path" >&2
              exit 1
            fi
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          if [[ -n "${BUILD_ARTIFACT:-}" ]]; then
            rm -f -- "$BUILD_ARTIFACT"
          fi

  build_android:
    name: Build and upload Android Release
    if: >-
      ${{github.event.pull_request.head.repo.full_name == github.repository}}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: development-builds
    permissions:
      contents: read
    # Masked install URL handed to the notify job so it can post one combined,
    # threaded Discord reply per commit. Job outputs are not echoed to logs and
    # are not exposed via the public REST API.
    outputs:
      install_url: ${{ steps.upload.outputs.install_url }}
    env:
      EAS_BUILD_GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
    steps:
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "The development-builds environment is missing EXPO_TOKEN." >&2
            exit 1
          fi

      - name: Configure isolated build paths
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "BUILD_ARTIFACT=$RUNNER_TEMP/streetcryptid-pr-$PR_NUMBER.apk"
            echo "EAS_LOCAL_BUILD_ARTIFACTS_DIR=$RUNNER_TEMP/eas-artifacts-android"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-local-build-android"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/modules/iroh-location/rust/target"
            echo "RUSTUP_TOOLCHAIN=stable"
          } >> "$GITHUB_ENV"

      - name: Check out PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore JavaScript package caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm/_cacache
          key: eas-local-js-${{ runner.os }}-${{ runner.arch }}-${{ env.EAS_CLI_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            eas-local-js-${{ runner.os }}-${{ runner.arch }}-${{ env.EAS_CLI_VERSION }}-

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Install the SDK 57 Android NDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"
          ndk_home="$ANDROID_HOME/ndk/27.1.12297006"
          {
            echo "ANDROID_NDK=$ndk_home"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: modules/iroh-location/rust -> target
          key: eas-local-${{ hashFiles('scripts/eas-build-pre-install.sh', 'scripts/generate-uniffi-bindings.sh', 'modules/iroh-location/rust/src/**/*.rs', 'modules/iroh-location/rust/third_party/**/*.rs') }}
          cache-workspace-crates: 'true'

      - name: Restore Gradle dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
          key: eas-local-gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'app.json', 'app.config.ts', 'modules/iroh-location/android/build.gradle') }}
          restore-keys: |
            eas-local-gradle-${{ runner.os }}-

      - name: Install EAS CLI
        run: bun add --global "eas-cli@$EAS_CLI_VERSION"

      - name: Verify EAS log isolation
        run: bash scripts/test-eas-ci-log-isolation.sh

      - name: Build the standalone Release locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" "$EAS_LOCAL_BUILD_WORKINGDIR"
          bash scripts/eas-local-build-ci.sh \
            android \
            production-internal-android \
            "$BUILD_ARTIFACT"

      # Join the tailnet so the internal distribution host is reachable. The
      # ephemeral node is torn down at job end. Nothing prints the tailnet
      # topology (no `tailscale status`), keeping it off the public logs.
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Bland fixed node name so neither the logs nor the tailnet admin view
          # show anything identifying. The action's own output is benign (version
          # + download + "connected"); the tailnet topology only ever leaks from
          # an explicit `tailscale status`, which this workflow never runs.
          hostname: ci-ephemeral

      - name: Upload the build to the internal distribution server
        id: upload
        env:
          DISTRIBUTOR_BASE_URL: ${{ secrets.DISTRIBUTOR_BASE_URL }}
          DISTRIBUTOR_TOKEN: ${{ secrets.DISTRIBUTOR_TOKEN }}
        run: |
          set -euo pipefail
          # Suppress all output: the install URL and internal host must not reach
          # the public logs. The masked URL is written to $GITHUB_OUTPUT for the
          # notify job to post to Discord.
          if ! bash scripts/upload-build.sh android "$BUILD_ARTIFACT" >/dev/null 2>&1; then
            echo "Uploading the build to the internal distribution server failed." >&2
            exit 1
          fi

      - name: Remove local build state
        if: always()
        run: |
          set -euo pipefail
          for path in \
            "${EAS_LOCAL_BUILD_ARTIFACTS_DIR:-}" \
            "${EAS_LOCAL_BUILD_WORKINGDIR:-}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            if [[ "$path" != "$RUNNER_TEMP/"* ]]; then
              echo "Refusing to clean unexpected path: $path" >&2
              exit 1
            fi
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          if [[ -n "${BUILD_ARTIFACT:-}" ]]; then
            rm -f -- "$BUILD_ARTIFACT"
          fi

  notify:
    name: Notify build thread
    if: >-
      ${{
        always() &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.user.login == 'Cobular' ||
          github.event.pull_request.user.login == 'ava-ankenbrandt' ||
          github.event.pull_request.user.login == 'unrealJune' ||
          (github.event.pull_request.user.login == 'copilot-swe-agent[bot]' &&
            startsWith(github.event.pull_request.head.ref, 'copilot/')))
      }}
    needs:
      - build_ios
      - build_android
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_RESULT: ${{ needs.build_ios.result }}
      ANDROID_RESULT: ${{ needs.build_android.result }}
      IOS_URL: ${{ needs.build_ios.outputs.install_url }}
      ANDROID_URL: ${{ needs.build_android.outputs.install_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      # Posts one combined build reply into the PR's Discord forum thread
      # (creating it on the first commit). Install links go ONLY to Discord; the
      # PR comment carries no link or host — just build status and the hidden
      # thread-id marker used to reuse the same thread on later commits.
      - name: Notify the PR build thread
        run: |
          set -euo pipefail

          marker='<!-- streetcryptid-builds -->'

          # Find our existing status comment and any thread id stored in it.
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"
          comment_id="$(jq -r --arg m "$marker" 'map(select(.body | contains($m)))[0].id // empty' <<<"$comments")"
          existing_thread="$(
            jq -r --arg m "$marker" 'map(select(.body | contains($m)))[0].body // ""' <<<"$comments" |
              sed -n 's/.*<!-- disc-thread:\([0-9]\{1,\}\) -->.*/\1/p'
          )"

          # Post to Discord with all output suppressed — no URL, host, or webhook
          # may reach the public logs. The resulting thread id comes back in a file.
          tid_file="$RUNNER_TEMP/discord-thread-id"
          : > "$tid_file"
          discord_ok=1
          if ! DISCORD_THREAD_ID="$existing_thread" DISCORD_THREAD_ID_OUT="$tid_file" \
                bash scripts/notify-discord-thread.sh >/dev/null 2>&1; then
            discord_ok=0
          fi
          thread_id="$(cat "$tid_file" 2>/dev/null || true)"
          [[ -z "$thread_id" ]] && thread_id="$existing_thread"

          # PR status comment: no links, no host — status plus the hidden thread
          # marker so the next commit reuses this thread.
          platform_line() {
            if [[ "$2" == "success" ]]; then
              printf -- '- **%s:** ✅ ready — install link in the team channel thread\n' "$1"
            else
              printf -- '- **%s:** ❌ build failed — [logs](%s)\n' "$1" "$RUN_URL"
            fi
          }
          body="$(
            printf '%s<!-- disc-thread:%s -->\n' "$marker" "$thread_id"
            printf '🏗️ **PR standalone Release builds**\n\n'
            platform_line "iOS" "$IOS_RESULT"
            platform_line "Android" "$ANDROID_RESULT"
            printf '\nInstall links are posted to the private team channel thread for this PR and kept off this public repo.'
            if [[ "$discord_ok" -ne 1 ]]; then
              printf '\n\n_⚠️ Could not reach the Discord build thread this run._'
            fi
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --raw-field body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$body" >/dev/null
          fi

          if [[ "$discord_ok" -ne 1 ]]; then
            echo "Failed to notify the Discord build thread." >&2
            exit 1
          fi
